<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link rel="preload" href="/fonts/geist-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/baloo-digits.woff2" as="font" type="font/woff2" crossorigin />
    <title>Lottery</title>
    <style>
      /* Painted before the JS bundle parses, so there is never a blank screen.
         Values are copied from styles/tokens.css: this runs before any CSS
         loads, so it cannot read the custom properties. */
      body {
        margin: 0;
        background: #4A0606;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: radial-gradient(120% 46% at 50% 0%, rgba(244, 200, 66, 0.09) 0%, transparent 70%), #4A0606;
        opacity: 1;
        transition: opacity 0.35s cubic-bezier(0.23, 1, 0.32, 1);
      }
      #splash.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #splash .badge {
        width: 62px;
        height: 62px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Geist', -apple-system, system-ui, sans-serif;
        font-weight: 800;
        font-size: 22px;
        letter-spacing: -0.02em;
        color: #FFC53D;
        background: #151E2A;
        border: 1px solid rgba(255, 197, 61, 0.28);
      }
      #splash .label {
        font-family: 'Geist', -apple-system, system-ui, sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #6B7C91;
      }
      @media (prefers-reduced-motion: reduce) {
        #splash {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="badge">6/49</div>
      <div class="label">Loading draw</div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
