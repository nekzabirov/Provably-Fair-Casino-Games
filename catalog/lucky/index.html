<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- The type is self-hosted and subset (49KB, latin + cyrillic, 100-900). A
         Google Fonts <link> would be a render-blocking third-party round trip on
         a cold Telegram WebView, which is exactly where this game is opened. -->
    <link rel="preload" href="/fonts/geist-var.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Geist';
        src: url('/fonts/geist-var.woff2') format('woff2-variations');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      html,
      body {
        margin: 0;
        background: #17212b;
        font-family: 'Geist', -apple-system, 'Segoe UI', system-ui, sans-serif;
      }
    </style>
    <title>Lucky Cups</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
